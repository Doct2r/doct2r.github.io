name: Deploy Site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: hub/package-lock.json

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.154.5'
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install hub dependencies
        working-directory: hub
        run: npm ci

      - name: Build hub (root site)
        working-directory: hub
        run: npm run build

      - name: Build blog (Hugo)
        run: |
          hugo --source blog --minify --buildFuture \
               --baseURL "${{ steps.pages.outputs.base_url }}/blog/"

      - name: Index blog with Pagefind
        run: npx pagefind --site blog/public --output-subdir _pagefind

      - name: Assemble combined site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/blog
          cp -r hub/dist/. _site/
          cp -r blog/public/. _site/blog/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
