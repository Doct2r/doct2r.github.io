services:
  hugo:
    image: hugomods/hugo:exts
    ports:
      - "1313:1313"
    volumes:
      - ./blog:/src
    working_dir: /src
    command: hugo server --bind 0.0.0.0 --buildDrafts --disableFastRender

  hub:
    image: node:22-slim
    ports:
      - "4321:4321"
    volumes:
      - ./hub:/src
    working_dir: /src
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
